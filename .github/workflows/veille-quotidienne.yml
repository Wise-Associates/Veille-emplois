name: Veille quotidienne

on:
  # Quatre passages par jour (heures UTC ; 6 h ou 7 h à Paris pour le premier). Les serveurs d'envoi limitent les
  # messages par heure (IONOS : 50 à 500 selon l'âge de la boîte) : plusieurs petits passages font partir plus d'offres
  # qu'un seul gros, avec MAX_OFFER_EMAILS_PER_RUN sous la limite horaire. Seul le passage de 5 h envoie toujours le
  # récapitulatif à l'équipe (DIGEST_MODE ci-dessous). GitHub peut retarder un départ de quelques minutes.
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : lire les sources et afficher le récapitulatif dans le journal, sans l'envoyer ni retenir l'état"
        type: boolean
        default: false

# Lecture seule par défaut ; chaque job ne reçoit que ce dont il a besoin. Le job qui exécute le code et ses
# dépendances npm n'a jamais le droit d'écrire dans le dépôt (voir docs/adr/0002).
permissions:
  contents: read

# Jamais deux passages en même temps : ils se disputeraient la branche d'état.
concurrency:
  group: veille
  cancel-in-progress: false

env:
  STATE_BRANCH: veille-etat

jobs:
  passage:
    runs-on: ubuntu-latest
    # 200 offres par passage (une par seconde, plus la lecture de leur page) : une quinzaine de minutes au plus.
    # Augmenter ce délai si MAX_OFFER_EMAILS_PER_RUN est relevé.
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      etat-enregistre: ${{ steps.passage.outputs.etat-enregistre }}
    env:
      STATE_FILE: etat/etat.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts : aucune dépendance n'a de script d'installation légitime ; on n'en exécute aucun.
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Récupérer l'état (branche veille-etat)
        run: |
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$STATE_BRANCH"
            mkdir -p etat
            # Branche présente sans etat.json : arrêt, plutôt que de repartir de zéro en silence.
            git show FETCH_HEAD:etat.json > etat/etat.json \
              || { echo "::error::etat.json absent de la branche $STATE_BRANCH"; exit 1; }
          else
            rc=$?
            # Code 2 : la branche n'existe pas (premier passage). Tout autre code : réseau ou droits, on s'arrête.
            if [ "$rc" -ne 2 ]; then echo "::error::Branche $STATE_BRANCH illisible (git ls-remote, code $rc)"; exit "$rc"; fi
            echo "Pas encore de branche $STATE_BRANCH : premier passage, toutes les sources seront initialisées."
          fi

      - name: Passage de la veille
        id: passage
        env:
          ESSAI: ${{ inputs.essai }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          OFFERS_TO: ${{ secrets.OFFERS_TO }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Réglages (organismes, sources, filtre informatique) lus dans MyBestConsultant, ADR 0005. Non définis : ceux
          # du dépôt (config/defaults.json), signalés dans le récapitulatif.
          VEILLE_CONFIG_URL: ${{ secrets.VEILLE_CONFIG_URL }}
          VEILLE_CONFIG_TOKEN: ${{ secrets.VEILLE_CONFIG_TOKEN }}
          MAX_OFFER_EMAILS_PER_RUN: ${{ vars.MAX_OFFER_EMAILS_PER_RUN }}
          # Récapitulatif : toujours pour le passage de 5 h et les lancements manuels ; pour les autres passages
          # planifiés, seulement s'il y a un point à vérifier.
          DIGEST_MODE: ${{ github.event_name == 'schedule' && github.event.schedule != '0 5 * * *' && 'problems' || 'always' }}
        run: |
          if [ "$ESSAI" = "true" ]; then
            node --enable-source-maps dist/main.js --dry-run
            exit $?
          fi
          # Code 0 : tout est parti. Code 3 : état enregistré mais un envoi a échoué (src/main.ts) : l'état est poussé
          # quand même, sinon les offres déjà envoyées repartiraient au passage suivant. Autre code : rien à pousser.
          set +e
          node --enable-source-maps dist/main.js
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then echo "etat-enregistre=true" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      - name: Transmettre l'état au job d'enregistrement
        if: ${{ !cancelled() && steps.passage.outputs.etat-enregistre == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etat
          path: etat/etat.json
          if-no-files-found: error
          retention-days: 1

  enregistrer:
    needs: passage
    # Aussi quand le passage a échoué après avoir enregistré l'état (code 3) : voir le job « passage ».
    if: ${{ !cancelled() && needs.passage.outputs.etat-enregistre == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Seul job autorisé à écrire : il n'exécute que git, jamais le code du projet ni npm.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Préparer la branche d'état
        run: |
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$STATE_BRANCH"
            git worktree add etat FETCH_HEAD
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then echo "::error::Branche $STATE_BRANCH illisible (git ls-remote, code $rc)"; exit "$rc"; fi
            # Branche orpheline (sans historique ni code), forme compatible avec les git sans « worktree add --orphan ».
            # Les fichiers du code restent dans le dossier mais hors index : seul etat.json est jamais ajouté.
            git worktree add --detach etat
            git -C etat checkout --quiet --orphan "$STATE_BRANCH"
            git -C etat rm -r --quiet --cached .
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etat
          path: etat

      - name: Enregistrer l'état
        working-directory: etat
        run: |
          git add etat.json
          if git diff --cached --quiet; then
            echo "État inchangé."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "État de la veille du $(date -u +%F)"
          git push origin "HEAD:refs/heads/$STATE_BRANCH"

  # Un échec planifié n'est signalé par GitHub qu'à la personne qui a modifié le cron en dernier : un ticket prévient
  # toutes les personnes qui suivent le dépôt. Un seul ticket ouvert à la fois, complété à chaque nouvel échec.
  alerte:
    needs: [passage, enregistrer]
    # Un job tué par son délai maximal est « annulé », pas « en échec » : les deux cas ouvrent le ticket.
    if: ${{ failure() || contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou compléter le ticket d'incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Échec de la veille quotidienne"
          body="Le passage du $(date -u +%F) a échoué. Cause dans le journal de l'exécution : $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
